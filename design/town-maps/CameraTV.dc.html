<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Camera field-of-view on the TV</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link href="https://fonts.googleapis.com/css2?family=M+PLUS+Rounded+1c:wght@400;700;800&amp;display=swap" rel="stylesheet">
<style>
body{margin:0}
.obj{position:absolute;display:flex;flex-direction:column;align-items:center;gap:6px;font-size:14px;font-weight:700}
.ring{border-radius:50%;border:4px solid #FFF8E7;box-sizing:border-box}
.dim{opacity:0.55}
.note{position:absolute;background:#FFF8E7;border:3px solid #3B3A36;border-radius:16px;padding:8px 14px;font-size:15px}
</style>
</helmet>
<div style="width: 960px; height: 540px; position: relative; overflow: hidden; background: #A9CF94; font-family: 'M PLUS Rounded 1c', sans-serif; color: #3B3A36">

<div style="position: absolute; left: 0; top: 0; width: 960px; height: 26px; background: #A07D55; border-bottom: 3px solid #3B3A36"></div>

<div style="position: absolute; left: 200px; top: 80px; width: 560px; height: 380px; background: #DCEFC6; border: 0; clip-path: polygon(0% 50%, 100% 0%, 100% 100%)"></div>
<div style="position: absolute; left: 200px; top: 80px; width: 560px; height: 380px; background: #3B3A36; clip-path: polygon(0% 50%, 100% 0%, 100% 1.2%, 1.2% 50%, 100% 98.8%, 100% 100%)"></div>

<div class="obj" style="left: 150px; top: 240px"><div style="width: 60px; height: 60px; border-radius: 50%; background: #D9533C; border: 3px solid #3B3A36; color: #FFFFFF; font-size: 20px; font-weight: 800; display: flex; align-items: center; justify-content: center">私</div></div>
<div class="obj" style="left: 90px; top: 300px"><div style="width: 44px; height: 36px; border-radius: 18px; background: #FFFFFF; border: 3px solid #3B3A36"></div>いぬ</div>

<div class="obj" style="left: 600px; top: 130px"><div class="ring" style="width: 96px; height: 96px; display: flex; align-items: center; justify-content: center"><div style="width: 72px; height: 72px; border-radius: 50%; background: #3B6D11; border: 3px solid #3B3A36"></div></div>木 · in frame</div>
<div class="obj" style="left: 430px; top: 280px"><div class="ring" style="width: 76px; height: 76px; display: flex; align-items: center; justify-content: center"><div style="width: 52px; height: 52px; border-radius: 50%; border: 9px solid #378ADD; box-sizing: border-box"></div></div>ホース · in frame</div>
<div class="obj" style="left: 640px; top: 330px"><div class="ring" style="width: 72px; height: 72px; display: flex; align-items: center; justify-content: center"><div style="width: 52px; height: 40px; border-radius: 20px; background: #EF9F27; border: 3px solid #3B3A36"></div></div>ねこ · in frame</div>

<div class="obj dim" style="left: 300px; top: 440px"><div style="width: 48px; height: 52px; border-radius: 6px 6px 14px 14px; background: #85B7EB; border: 3px solid #3B3A36"></div>out of frame</div>
<div class="obj dim" style="left: 260px; top: 60px"><div style="width: 56px; height: 56px; border-radius: 8px; background: #C9A27A; border: 3px solid #3B3A36"></div>out of frame</div>

<div class="note" style="left: 780px; top: 60px; width: 160px; box-sizing: border-box">The triangle shows only while the camera app is open</div>
<div class="note" style="left: 780px; top: 200px; width: 160px; box-sizing: border-box">Turn with the joystick to aim it</div>
<div class="note" style="left: 780px; top: 320px; width: 160px; box-sizing: border-box">Objects inside get a ring; the photo captures them all</div>

</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":960,"height":540}}'>
class Component extends DCLogic {
renderVals() {
return {};
}
}
</script>
</body>
</html>
