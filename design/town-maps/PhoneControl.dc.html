<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Phone controller</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link href="https://fonts.googleapis.com/css2?family=M+PLUS+Rounded+1c:wght@400;700;800&amp;display=swap" rel="stylesheet">
<style>
body{margin:0}
a{color:#3B3A36}a:hover{color:#1F1E1B}
.tab{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px;text-decoration:none;font-size:12px;color:#4F4C45}
.tab b{font-size:17px;font-weight:800;color:#3B3A36}
.on{background:#FFE0CC}
.chip{flex:1;border:3px solid #3B3A36;border-radius:16px;padding:8px 6px;text-align:center;font-size:13px;box-sizing:border-box}
.sm{border:2px solid #3B3A36;border-radius:999px;background:#FFFFFF;padding:8px 14px;font-family:inherit;font-size:14px;font-weight:700;color:#3B3A36;min-height:44px}
</style>
</helmet>
<div style="width: 390px; height: 844px; position: relative; overflow: hidden; background: #DCEBC4; font-family: 'M PLUS Rounded 1c', sans-serif; color: #3B3A36">

<div style="padding: 20px 20px 0; display: flex; justify-content: space-between; align-items: center">
<div><p style="margin: 0; font-size: 22px; font-weight: 800">裏庭</p><p style="margin: 0; font-size: 13px">Backyard</p></div>
<div style="background: #3B3A36; color: #FFF8E7; border-radius: 999px; padding: 6px 14px; font-size: 14px; font-weight: 700">夜 · zombie night</div>
</div>

<div style="margin: 16px 20px 0; background: #FFFFFF; border: 3px solid #3B3A36; border-radius: 22px; padding: 14px 16px">
<p style="margin: 0; font-size: 13px; color: #4F4C45">Last heard · 大家さん</p>
<p style="margin: 6px 0 12px; font-size: 22px; font-weight: 700">「赤い帽子のゾンビ、来たよ！」</p>
<div style="display: flex; gap: 8px">
<button class="sm" type="button">もう一回 · replay</button>
<button class="sm" type="button">ゆっくり · slow</button>
</div>
</div>

<p style="margin: 18px 20px 8px; font-size: 14px; font-weight: 700">Your dogs</p>
<div style="margin: 0 20px; display: flex; gap: 8px">
<div class="chip" style="background: #FFFFFF"><b style="font-size: 15px">白い犬</b><br>free</div>
<div class="chip" style="background: #E9E2D3"><b style="font-size: 15px">茶色い犬</b><br>fetching…</div>
<div class="chip" style="background: #FFFFFF"><b style="font-size: 15px">ぶちの犬</b><br>free</div>
</div>

<p style="margin: 18px 20px 0; font-size: 13px; text-align: center; color: #4F4C45">Which dog + what target + what to do</p>

<div style="position: absolute; left: 20px; right: 20px; top: 520px; display: flex; justify-content: space-between; align-items: center">
<div style="width: 140px; height: 140px; border-radius: 50%; background: #C6E0A8; border: 3px solid #3B3A36; display: flex; align-items: center; justify-content: center" aria-label="Walking joystick" role="img">
<div style="width: 60px; height: 60px; border-radius: 50%; background: #FFF8E7; border: 3px solid #3B3A36"></div>
</div>
<button type="button" onPointerDown="{{ startTalk }}" onPointerUp="{{ stopTalk }}" onPointerLeave="{{ stopTalk }}" style="width: 170px; height: 170px; border-radius: 50%; border: 4px solid #3B3A36; background: {{ pttBg }}; color: {{ pttFg }}; font-family: inherit; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 4px; cursor: pointer">
<svg width="34" height="34" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true"><rect x="9" y="3" width="6" height="11" rx="3"/><path d="M5 11a7 7 0 0 0 14 0M12 18v3"/></svg>
<span style="font-size: 20px; font-weight: 800">{{ pttLabel }}</span>
<span style="font-size: 12px">{{ pttSub }}</span>
</button>
</div>

<a href="PhoneHome.dc.html" style="position: absolute; left: 95px; bottom: 24px; width: 200px; height: 52px; box-sizing: border-box; background: #FFF8E7; border: 3px solid #3B3A36; border-radius: 999px; display: flex; align-items: center; justify-content: center; gap: 8px; text-decoration: none; font-size: 16px; font-weight: 800"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="#3B3A36" stroke-width="2" aria-hidden="true"><rect x="6" y="2" width="12" height="20" rx="3"/><path d="M10 18h4"/></svg>スマホ · Phone<span style="min-width: 22px; height: 22px; border-radius: 11px; background: #D9533C; color: #FFFFFF; font-size: 12px; display: flex; align-items: center; justify-content: center">6</span></a>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":390,"height":844}}'>
class Component extends DCLogic {
constructor(props) {
super(props);
this.state = { talking: false };
}
renderVals() {
const t = this.state.talking;
return {
startTalk: () => this.setState({ talking: true }),
stopTalk: () => this.setState({ talking: false }),
pttBg: t ? '#D9533C' : '#FFE0CC',
pttFg: t ? '#FFFFFF' : '#3B3A36',
pttLabel: t ? '聞いてる…' : '話す',
pttSub: t ? 'Listening' : 'Hold to talk'
};
}
}
</script>
</body>
</html>
